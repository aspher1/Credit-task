name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLOW_DEMO: 'true'
      AUTH_SECRET: 'local-ci-test-secret-not-for-production'
      ADMIN_EMAIL: 'admin@creditask.local'
      ADMIN_PASSWORD: 'local-ci-test-only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build (demo configuration only)
        run: npm run build
